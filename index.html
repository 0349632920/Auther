<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticator - Bảo mật 2FA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Hind', 'sans-serif'] }, 
                    colors: { roblox: '#00A2FF', robloxDark: '#0084D1', bg: '#F2F4F5', darkbg: '#232527', darkcard: '#393B3D', robloxGray: '#E3E5E7' }, 
                    boxShadow: { 'soft': '0 4px 10px rgba(0, 0, 0, 0.08)' } 
                } 
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    
    <style>
        #lockScreen { position: fixed; inset: 0; background: #F2F4F5; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
        .dark #lockScreen { background: #232527; }
        #lockScreen.hidden-lock { opacity: 0; pointer-events: none; display: none; }
        .roblox-btn { background-color: #00A2FF; border-radius: 8px; font-weight: 600; transition: all 0.2s ease; }
        .roblox-btn:hover { background-color: #0084D1; }
        .roblox-btn:active { transform: scale(0.96); }
        .roblox-card { background-color: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); border: 1px solid #E3E5E7; transition: all 0.2s ease; }
        .dark .roblox-card { background-color: #393B3D; border: 1px solid #4A4D50; }
        .roblox-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-bg dark:bg-darkbg text-gray-800 dark:text-gray-100 font-sans h-screen flex flex-col overflow-hidden transition-colors duration-300 relative">

    <div id="toast" class="custom-toast"></div>

    <!-- MÀN HÌNH KHÓA -->
    <div id="lockScreen" class="hidden-lock">
        <div class="w-20 h-20 bg-roblox rounded-2xl flex items-center justify-center mb-6 shadow-soft"><i class="fas fa-lock text-4xl text-white"></i></div>
        <h2 class="text-2xl font-bold mb-2">Ứng dụng đã khóa</h2>
        <div class="relative w-72 mt-4">
            <input type="password" id="unlockPass" placeholder="Nhập mật khẩu..." class="w-full bg-white dark:bg-darkcard text-center text-lg px-4 py-3 rounded-xl shadow-soft focus:outline-none focus:ring-2 focus:ring-roblox border border-gray-200 dark:border-gray-700">
            <button id="btnUnlock" class="absolute right-2 top-2 w-10 h-10 roblox-btn text-white rounded-lg"><i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <!-- THANH CÔNG CỤ -->
    <div class="flex items-center justify-between px-6 md:px-8 py-5 max-w-5xl w-full mx-auto">
        <div class="flex items-center gap-3 w-full">
            <button id="btnAdd" class="roblox-btn flex items-center gap-2 text-white px-5 py-2.5 shadow-soft"><i class="fas fa-plus"></i> Add</button>
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search accounts..." class="w-full bg-robloxGray dark:bg-darkcard text-gray-800 dark:text-gray-100 pl-11 pr-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-roblox border border-transparent dark:border-gray-700 transition-all">
            </div>
        </div>
        <div class="flex gap-2 ml-4">
            <button id="btnUser" class="w-12 h-12 bg-white dark:bg-darkcard hover:bg-gray-50 dark:hover:bg-gray-800 rounded-xl flex items-center justify-center shadow-soft border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:text-roblox transition"><i class="fas fa-user text-lg" id="iconUser"></i></button>
            <button id="btnImport" class="w-12 h-12 bg-white dark:bg-darkcard hover:bg-gray-50 dark:hover:bg-gray-800 rounded-xl flex items-center justify-center shadow-soft border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:text-roblox transition"><i class="fas fa-file-import text-lg"></i></button>
            <button id="btnSettings" class="w-12 h-12 bg-white dark:bg-darkcard hover:bg-gray-50 dark:hover:bg-gray-800 rounded-xl flex items-center justify-center shadow-soft border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:text-roblox transition"><i class="fas fa-cog text-lg"></i></button>
        </div>
    </div>

    <!-- DANH SÁCH TÀI KHOẢN -->
    <div id="accountList" class="flex-1 overflow-y-auto px-6 md:px-8 pb-10">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-5xl mx-auto auto-rows-max"></div>
        <div id="emptyState" class="flex flex-col items-center justify-center h-full mt-20 hidden opacity-0 transition-opacity duration-500">
            <div class="w-24 h-24 bg-gray-200 dark:bg-gray-800 rounded-full flex items-center justify-center mb-6 shadow-inner"><i class="fas fa-shield-alt text-4xl text-gray-400"></i></div>
            <h2 class="text-2xl font-bold text-gray-700 dark:text-gray-300">Chưa có tài khoản nào</h2>
        </div>
    </div>

    <!-- MODAL CÀI ĐẶT -->
    <div id="modalSettings" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white dark:bg-darkcard rounded-2xl p-6 w-full max-w-md shadow-2xl transform scale-95 transition-transform duration-300" id="modalSettingsContent">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xl font-bold">Cài đặt</h2>
                <button id="btnCloseSettings" class="text-gray-400 hover:text-gray-700 transition"><i class="fas fa-times text-lg"></i></button>
            </div>
            <div class="flex items-center justify-between mb-5 pb-5 border-b border-gray-200 dark:border-gray-700">
                <div>
                    <h3 class="font-bold">Giao diện</h3>
                    <p class="text-xs text-gray-500">Chọn chế độ Sáng hoặc Tối</p>
                </div>
                <button id="btnToggleTheme" class="w-12 h-7 bg-gray-300 dark:bg-roblox rounded-full relative transition-colors duration-300">
                    <div class="w-5 h-5 bg-white rounded-full absolute top-1 left-1 transition-transform duration-300 shadow-sm" id="themeThumb"></div>
                </button>
            </div>
            
            <div class="mb-5 pb-5 border-b border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="font-bold">Tự động khóa khi rời tab</h3>
                        <p class="text-xs text-gray-500">Khóa app ngay khi chuyển tab khác</p>
                    </div>
                    <button id="btnToggleAutoLock" class="w-12 h-7 bg-gray-300 dark:bg-roblox rounded-full relative transition-colors duration-300">
                        <div class="w-5 h-5 bg-white rounded-full absolute top-1 left-1 transition-transform duration-300 shadow-sm" id="autoLockThumb"></div>
                    </button>
                </div>
            </div>

            <div class="mb-5">
                <h3 class="font-bold mb-1">Mật khẩu bảo vệ App</h3>
                <input type="password" id="inputPassword" placeholder="Nhập mật khẩu..." class="w-full bg-gray-100 dark:bg-gray-800 px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-roblox border border-gray-200 dark:border-gray-700">
            </div>
            <div class="flex justify-end mt-4">
                <button id="btnSaveSettings" class="px-5 py-2.5 rounded-xl roblox-btn text-white shadow-md">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <!-- CÁC MODAL KHÁC (Thêm tài khoản, Profile, Đăng xuất...) -->
    <!-- (Bạn giữ nguyên phần này từ code trước) -->
    <!-- ... -->
    
    <script src="app.js"></script>
</body>
</html>
