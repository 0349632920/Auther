<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - HungAuth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { proton: '#6D4AFF', bg: '#F5F5F7', darkbg: '#121212', darkcard: '#1E1E1E' } } } }</script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-bg dark:bg-darkbg text-gray-800 dark:text-gray-100 font-sans h-screen flex items-center justify-center">
    <div class="bg-white dark:bg-darkcard p-8 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100 dark:border-gray-800">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-proton text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg shadow-proton/30"><i class="fas fa-user-lock"></i></div>
            <h1 class="text-2xl font-bold">Đăng nhập</h1>
            <p class="text-gray-500 text-sm mt-1">Đồng bộ mã 2FA của bạn</p>
        </div>
        
        <input type="email" id="email" placeholder="Email..." class="w-full bg-gray-50 dark:bg-gray-800 px-4 py-3 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-proton border border-gray-200 dark:border-gray-700">
        <input type="password" id="password" placeholder="Mật khẩu..." class="w-full bg-gray-50 dark:bg-gray-800 px-4 py-3 rounded-xl mb-6 focus:outline-none focus:ring-2 focus:ring-proton border border-gray-200 dark:border-gray-700">
        
        <button id="btnLogin" type="button" class="w-full py-3 rounded-xl bg-proton text-white font-semibold hover:bg-[#5B3DD6] shadow-lg shadow-proton/30 btn-anim mb-4">Đăng nhập</button>
        
        <div class="text-center text-sm text-gray-500">
            Chưa có tài khoản? <a href="/register" class="text-proton font-semibold hover:underline">Đăng ký ngay</a>
        </div>
        <div class="text-center mt-4">
            <a href="/" class="text-gray-400 hover:text-gray-600 text-sm"><i class="fas fa-arrow-left mr-1"></i> Về trang chủ</a>
        </div>
    </div>

    <script>
        const db = window.supabase.createClient('https://skwsuorigvxwwugpldvn.supabase.co', 'DÁN_ANON_KEY_CỦA_BẠN_VÀO_ĐÂY');
        
        document.getElementById('btnLogin').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) return alert("Vui lòng nhập đủ thông tin!");
            
            const { data, error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
                alert("Lỗi đăng nhập: " + error.message);
            } else {
                alert("Đăng nhập thành công!");
                window.location.href = "/"; // Chuyển về trang chủ
            }
        });
    </script>
</body>
</html>
